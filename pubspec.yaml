publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_stripe: ^12.6.0
  flutter_launcher_icons: ^0.14.4
  get: ^4.7.3
