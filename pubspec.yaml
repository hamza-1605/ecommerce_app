name: ekart
description: "E-Kart | An Ecommerce Application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_stripe: ^12.6.0
  flutter_launcher_icons: ^0.14.4
  flutter_svg: ^2.3.0
  get: ^4.7.3
  get_storage: ^2.1.1
  gradient_elevated_button: ^1.2.0
  http: ^1.6.0
  image_picker: ^1.2.1
  shared_preferences: ^2.3.2
  
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/svg/